# Local development dependencies.
#
# Previously this file lived in src/main/resources, which meant Maven packaged it into the
# application JAR, and it declared no Postgres service even though the app requires one.
#
#   docker compose -f docker/docker-compose.yml up -d
#
# Credentials here are local-only defaults and match the fallbacks in application.properties.

services:
  postgres:
    image: postgres:16-alpine
    container_name: splitwise-postgres
    environment:
      POSTGRES_DB: splitwise_db
      POSTGRES_USER: splitwise
      POSTGRES_PASSWORD: splitwise
    ports:
      # 5433 on the host so this never collides with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - splitwise-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitwise -d splitwise_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: splitwise-kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft mode: no ZooKeeper. Single node acting as both broker and controller.
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      # Two listeners: containers reach the broker on kafka:29092, the host on localhost:9092.
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Observability. Optional for running the app — start them with:
  #   docker compose -f docker/docker-compose.yml up -d prometheus grafana
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: splitwise-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Short retention: this is a local demo, not a historical archive.
      - --storage.tsdb.retention.time=6h

  grafana:
    image: grafana/grafana:11.4.0
    container_name: splitwise-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      # Local only. The point is to open the dashboard without a login prompt getting in
      # the way; nothing here is exposed beyond the host.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      # Provisioned from files so the dashboard is version-controlled rather than clicked
      # together and lost when the container is removed.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Trace collector and UI. Jaeger's all-in-one image accepts OTLP directly, so no separate
  # OpenTelemetry Collector is needed for a local setup.
  jaeger:
    image: jaegertracing/all-in-one:1.64.0
    container_name: splitwise-jaeger
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP/HTTP, which is what the application exports to
      - "4317:4317"     # OTLP/gRPC, for anything that prefers it
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

volumes:
  splitwise-pgdata:
