# ======================
# APPLICATION
# ======================
spring.application.name=Splitwise
server.port=${SERVER_PORT:8080}


# ======================
# DATABASE
# ======================
# Credentials come from the environment. Defaults match docker/docker-compose.yml so a
# local checkout runs without configuration, but nothing real is committed here.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/splitwise_db}
spring.datasource.username=${DB_USER:splitwise}
spring.datasource.password=${DB_PASSWORD:splitwise}

# Schema is owned by Flyway (src/main/resources/db/migration), never by Hibernate.
# 'validate' fails fast on drift between the entities and the migrated schema instead of
# silently altering tables at boot the way ddl-auto=update did.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.jpa.open-in-view=false
spring.jpa.show-sql=false


# ======================
# KAFKA COMMON
# ======================
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}


# ======================
# KAFKA CONSUMER
# ======================
# No spring.json.value.default.type: topics carry different event types and are
# discriminated by the type header the producer stamps on.
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=com.project.Splitwise.domain.event
spring.kafka.consumer.properties.spring.json.use.type.headers=true

# Offsets are committed per record after the listener returns normally. The listeners do
# not take an Acknowledgment parameter; Spring only populates that under a MANUAL
# ack-mode, and requesting it without one is what previously sent every record to the DLT.
spring.kafka.listener.ack-mode=record


# ======================
# KAFKA PRODUCER
# ======================
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=true

# Durability: wait for all in-sync replicas, and let the client retry transient
# leader elections without producing duplicates out of order.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5


# ======================
# OUTBOX RELAY
# ======================
splitwise.outbox.poll-interval-ms=${OUTBOX_POLL_INTERVAL_MS:500}
splitwise.outbox.batch-size=${OUTBOX_BATCH_SIZE:100}


# ======================
# OBSERVABILITY
# ======================
# Actuator listens on its own port, bound separately from the application.
#
# This is not cosmetic. Every application endpoint requires a bearer token, and a Prometheus
# scraper has no way to obtain one — so /actuator/prometheus on the main port would either be
# unscrapeable or need a hole punched in the security filter chain. A separate port keeps the
# application fully authenticated while exposing metrics only to whatever can reach 9090,
# which in a real deployment is the internal network and not the internet.
management.server.port=${MANAGEMENT_PORT:9090}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when_authorized

# Required, not decorative. Exposing the endpoint above is not sufficient: without this the
# PrometheusMeterRegistry bean is never created, Boot falls back to a SimpleMeterRegistry,
# and /actuator/prometheus 404s while every other actuator endpoint works. That failure is
# quiet -- the app starts fine and metrics are collected, they just cannot be scraped -- so
# MetricsIT asserts the scrape output rather than trusting the configuration.
management.prometheus.metrics.export.enabled=true

# Percentile histograms for the meters where the tail is the interesting part: an average
# convergence lag hides exactly the slow cases anyone would want to investigate.
management.metrics.distribution.percentiles-histogram.splitwise.convergence.lag=true
management.metrics.distribution.percentiles-histogram.splitwise.outbox.publish.lag=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Kafka consumer lag is scraped from the client metrics Micrometer binds automatically,
# rather than calling consumer.endOffsets() on every message in the listener hot path.
management.metrics.tags.application=${spring.application.name}


# ======================
# TRACING
# ======================
# Sample everything by default. Correct for a local demo and wrong for production, where a
# few percent is the usual setting -- the cost is per-span export, not per-request.
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}

# Where spans are shipped. Nothing listening simply means no traces; the exporter logs and
# the application carries on, so a missing collector is never a reason for a request to fail.
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Stated rather than left to the default. Without it the context propagator resolves to a
# no-op that neither reads an inbound traceparent nor writes one, which fails silently:
# spans are still produced, they are simply never linked to anything.
management.tracing.propagation.type=W3C

# Without these, the trace stops at the broker: Spring instruments the send and the listener
# only when observation is enabled, and the trace context rides to the consumer in Kafka
# headers that nothing would otherwise write.
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true


# ======================
# AUTHENTICATION
# ======================
# No default: a deployment that forgets to set this fails at startup rather than signing
# every token with a value that is sitting in a public git history. Must be >= 32 bytes.
splitwise.jwt.secret=${JWT_SECRET}
splitwise.jwt.ttl=${JWT_TTL:PT12H}
